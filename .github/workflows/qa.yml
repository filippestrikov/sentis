# Credential-free validation only. Authenticated staging regression runs locally; it is not runnable from GitHub until a protected environment exists (see docs/automation/CI_REVIEW.md).
name: Sentis QA

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      SENTIS_SUPER_ADMIN_EMAIL: ''
      SENTIS_SUPER_ADMIN_PASSWORD: ''
      SENTIS_CLIENT_ADMIN_EMAIL: ''
      SENTIS_CLIENT_ADMIN_PASSWORD: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: git ls-files '*.js' | xargs -r -n1 node --check
      - run: npm run test:list
      - run: npm run test:contrast-math
      - run: npm run security:evidence-check
      - run: npm run security:leak-check
